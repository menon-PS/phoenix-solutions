<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Midnight Navy Boardroom Background with Warm Amber Bokeh -->
    <linearGradient id="office-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2f" />
      <stop offset="50%" stop-color="#102540" />
      <stop offset="100%" stop-color="#081423" />
    </linearGradient>
    <radialGradient id="bokeh-1" cx="20%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#f6ad55" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0b1b2f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-2" cx="85%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#dd6b20" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b1b2f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-3" cx="15%" cy="65%" r="20%">
      <stop offset="0%" stop-color="#fbd38d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b1b2f" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Decorative Rings -->
    <linearGradient id="ring-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>

    <!-- Attire Gradients: Black Blazer, Dark Purple/Plum Shirt, Light Grey Pants -->
    <linearGradient id="blazer-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d" />
      <stop offset="45%" stop-color="#151922" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="blazer-lapel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a303c" />
      <stop offset="100%" stop-color="#12161f" />
    </linearGradient>
    <linearGradient id="plum-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c1a35" />
      <stop offset="50%" stop-color="#2e1329" />
      <stop offset="100%" stop-color="#1f0c1b" />
    </linearGradient>
    <linearGradient id="grey-pants" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="40%" stop-color="#8a9ba8" />
      <stop offset="100%" stop-color="#677582" />
    </linearGradient>

    <!-- Skin & Hair Gradients -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d69e77" />
      <stop offset="60%" stop-color="#bf855e" />
      <stop offset="100%" stop-color="#a76c46" />
    </linearGradient>
    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#965c36" />
      <stop offset="100%" stop-color="#7a4625" />
    </linearGradient>
    <linearGradient id="beard-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241d1a" />
      <stop offset="100%" stop-color="#120e0d" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="28" fill="url(#office-bg)"/>
  <!-- Ambient Bokeh Lights matching the user's photo -->
  <circle cx="90" cy="140" r="110" fill="url(#bokeh-1)"/>
  <circle cx="420" cy="120" r="130" fill="url(#bokeh-2)"/>
  <circle cx="70" cy="330" r="90" fill="url(#bokeh-3)"/>

  <!-- Outer Ring Accent -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#ring-border)" stroke-width="3" opacity="0.7"/>
  <circle cx="250" cy="250" r="228" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>

  <!-- Character Group: Replicating User Photo Pose -->
  <g id="vishnudas-portrait" filter="url(#soft-shadow)">
    <!-- Grey Trousers (Visible at waist/hip) -->
    <path d="M 180 445 L 320 445 L 340 500 L 160 500 Z" fill="url(#grey-pants)"/>
    <!-- Belt with silver buckle -->
    <rect x="200" y="443" width="100" height="14" rx="2" fill="#111827"/>
    <rect x="242" y="441" width="16" height="18" rx="2" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="247" y1="450" x2="253" y2="450" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Tailored Black Suit Jacket (Structured shoulders, hands casually in pockets) -->
    <path d="M 85 500 L 115 355 C 135 240 180 205 250 205 C 320 205 365 240 385 355 L 415 500 Z" fill="url(#blazer-black)"/>
    
    <!-- Arms angled forward into pockets -->
    <path d="M 85 500 L 110 370 L 145 420 L 175 480 L 155 500 Z" fill="#141822"/>
    <path d="M 415 500 L 390 370 L 355 420 L 325 480 L 345 500 Z" fill="#141822"/>

    <!-- Deep Plum / Purple Button-Down Shirt (Open collar at neckline) -->
    <path d="M 215 208 L 285 208 L 275 445 L 225 445 Z" fill="url(#plum-shirt)"/>
    <!-- Shirt Placket & Buttons -->
    <line x1="250" y1="235" x2="250" y2="445" stroke="#1d0a19" stroke-width="2.5"/>
    <circle cx="250" cy="270" r="2.5" fill="#11050f"/>
    <circle cx="250" cy="320" r="2.5" fill="#11050f"/>
    <circle cx="250" cy="370" r="2.5" fill="#11050f"/>
    <circle cx="250" cy="420" r="2.5" fill="#11050f"/>

    <!-- Open Shirt Collar Wings -->
    <polygon points="215,208 240,245 228,248 208,218" fill="#4d2244"/>
    <polygon points="285,208 260,245 272,248 292,218" fill="#4d2244"/>

    <!-- Black Suit Lapels (Notch Lapels) -->
    <path d="M 170 230 L 226 340 L 220 445 L 140 365 Z" fill="url(#blazer-lapel)"/>
    <path d="M 330 230 L 274 340 L 280 445 L 360 365 Z" fill="url(#blazer-lapel)"/>
    <!-- Notch cutaways -->
    <polygon points="185,260 205,265 198,278 178,272" fill="#0b0e14"/>
    <polygon points="315,260 295,265 302,278 322,272" fill="#0b0e14"/>

    <!-- Neck & Throat (Warm south-asian skin tone) -->
    <path d="M 225 160 L 275 160 L 278 225 C 278 238 222 238 222 225 Z" fill="url(#skin)"/>
    <!-- Throat shadow under chin -->
    <path d="M 226 160 L 274 160 L 270 185 C 255 198 245 198 230 185 Z" fill="url(#skin-shadow)" opacity="0.6"/>

    <!-- Head / Face (Oval, confident, proportional to photo) -->
    <path d="M 195 125 C 195 195 210 220 250 220 C 290 220 305 195 305 125 C 305 75 290 55 250 55 C 210 55 195 75 195 125 Z" fill="url(#skin)"/>

    <!-- Ears -->
    <path d="M 190 120 C 186 110 185 145 194 145 Z" fill="#bf855e"/>
    <path d="M 310 120 C 314 110 315 145 306 145 Z" fill="#bf855e"/>

    <!-- Well-groomed Full Black Beard & Mustache (Matching user photo) -->
    <path d="M 195 130 C 196 175 208 224 250 226 C 292 224 304 175 305 130 C 300 155 290 185 275 185 C 265 185 260 178 250 178 C 240 178 235 185 225 185 C 210 185 200 155 195 130 Z" fill="url(#beard-black)"/>
    <!-- Mustache -->
    <path d="M 230 160 Q 250 155 270 160 Q 250 174 230 160 Z" fill="#140f0e"/>

    <!-- Dark Hair with natural hairline and volume on top -->
    <path d="M 192 110 C 188 70 210 40 250 40 C 290 40 312 70 308 110 C 300 85 285 70 250 70 C 215 70 200 85 192 110 Z" fill="#1e1816"/>
    <path d="M 195 90 C 210 55 245 48 290 54 C 305 57 308 72 308 82 C 298 68 280 62 255 62 C 220 62 205 72 195 90 Z" fill="#2d2422"/>

    <!-- Eyebrows (Strong, masculine, well-defined) -->
    <path d="M 212 112 C 222 108 234 110 238 114" stroke="#120e0d" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 288 112 C 278 108 266 110 262 114" stroke="#120e0d" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Warm, focused, expressive) -->
    <ellipse cx="226" cy="122" rx="7" ry="5" fill="#ffffff"/>
    <circle cx="226" cy="122" r="3.5" fill="#1f1610"/>
    <circle cx="227" cy="121" r="1.2" fill="#ffffff"/>
    <path d="M 218 118 Q 226 115 234 118" stroke="#7a4625" stroke-width="1.2" fill="none"/>

    <ellipse cx="274" cy="122" rx="7" ry="5" fill="#ffffff"/>
    <circle cx="274" cy="122" r="3.5" fill="#1f1610"/>
    <circle cx="275" cy="121" r="1.2" fill="#ffffff"/>
    <path d="M 266 118 Q 274 115 282 118" stroke="#7a4625" stroke-width="1.2" fill="none"/>

    <!-- Nose -->
    <path d="M 250 115 L 246 145 Q 250 150 254 145 Z" fill="#bf855e" opacity="0.6"/>
    <path d="M 242 145 Q 250 150 258 145" stroke="#8c502b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Mouth / Smile -->
    <path d="M 238 168 Q 250 176 262 168" stroke="#68341b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Executive Designation Badge at Base -->
  <g transform="translate(60, 440)">
    <rect width="380" height="46" rx="12" fill="#0b1b2f" fill-opacity="0.95" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="190" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#00e5ff" letter-spacing="2">VISHNUDAS MENON</text>
    <text x="190" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#e2e8f0" letter-spacing="1.5">CO-FOUNDER &amp; DIRECTOR OF OPERATIONS</text>
  </g>
</svg>
